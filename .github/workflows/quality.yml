name: RED POLY Quality
on:
  pull_request:
    branches: [main]
  push:
    branches: [agent/04-design-qa]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, types, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Install pinned ESLint tools (without updating Bun lockfile)
        run: bun add --no-save --ignore-scripts eslint@9.39.1 eslint-config-expo@56.0.4
      - name: ESLint – shared components
        run: bunx eslint src/components/red-poly-ui.tsx --max-warnings=0
      - name: Unit and structure tests
        run: node --test tests/*.test.cjs
      - name: Expo web bundle smoke test
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform web --output-dir .ci-web-build
      - name: PR diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
