name: RED POLY Quality
on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Install, types, lint, tests
    # Playwright 1.56.1 provides Chromium dependencies for Ubuntu 24.04;
    # ubuntu-latest currently resolves to Ubuntu 26.04 and breaks browser setup.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5
      - name: Install exact locked dependencies
        run: bun install --frozen-lockfile
      - name: TypeScript
        run: bunx tsc --noEmit
      - name: Install pinned ESLint tools (without updating Bun lockfile)
        run: bun add --no-save --ignore-scripts eslint@9.39.1 eslint-config-expo@56.0.4
      - name: ESLint – Expo app (all source files, block errors)
        run: bunx eslint src --quiet
      - name: ESLint – shared components (strict)
        run: bunx eslint src/components/red-poly-ui.tsx --max-warnings=0
      - name: Release identity audit (report only, no signing or build)
        run: node scripts/release-identity-guard.cjs --audit
      - name: Unit and structure tests
        run: node --test tests/*.test.cjs
      - name: Expo web bundle smoke test
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform web --output-dir .ci-web-build
      - name: Install Chromium for browser interaction test
        run: |
          bun add --no-save --ignore-scripts playwright@1.56.1
          bunx playwright install --with-deps chromium
      - name: Production web security smoke test – QA routes redirect
        env:
          CI: "1"
        run: node tests/production-routes.browser.cjs
      - name: Browser E2E – onboarding and mobile/desktop design lab
        shell: bash
        env:
          CI: "1"
          EXPO_NO_TELEMETRY: "1"
        run: |
          bunx expo start --web --localhost --port 8081 > /tmp/red-poly-expo-web.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          ready=0
          for attempt in $(seq 1 90); do
            if curl -fsS http://localhost:8081/onboarding >/dev/null; then
              ready=1
              break
            fi
            if ! kill -0 "$server_pid" 2>/dev/null; then
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Expo development server did not answer on localhost:8081"
            tail -120 /tmp/red-poly-expo-web.log
            ss -ltnp | grep 8081 || true
            exit 1
          fi
          node tests/design-lab.browser.cjs
      - name: Upload mobile/desktop browser preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: red-poly-design-lab-browser
          path: .ci-browser-artifacts/
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
      - name: Expo iOS JS bundle smoke test (not a native IPA)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform ios --output-dir .ci-ios-bundle
      - name: Expo Android JS bundle smoke test (not an APK)
        env:
          EXPO_NO_TELEMETRY: "1"
        run: bunx expo export --platform android --output-dir .ci-android-bundle
      - name: PR diff whitespace check
        if: github.event_name == 'pull_request'
        run: git diff --check "${{ github.event.pull_request.base.sha }}" HEAD
