name: RED POLY Conversation Checks

on:
  pull_request:
    paths:
      - "src/features/conversation/**"
      - "src/app/conversation.tsx"
      - "src/app/(tabs)/practice.tsx"
      - "tests/conversation-engine.test.mjs"
      - ".github/workflows/conversation-checks.yml"
      - "tsconfig.conversation.json"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conversation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run offline conversation engine tests
        run: node --experimental-strip-types --test tests/conversation-engine.test.mjs
      - uses: oven-sh/setup-bun@v2
      - name: Install project dependencies
        run: bun install --frozen-lockfile
      - name: Check TypeScript
        run: bunx tsc --noEmit --project tsconfig.conversation.json
